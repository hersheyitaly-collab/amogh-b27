<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Amogh! ✨</title>
    <style>
        /* Kraft paper texture background */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
            background: #d7be9b url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E");
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* HTTPS Warning Note */
        .https-note {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Card Container & Perspective */
        .card-perspective {
            perspective: 1500px;
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }

        /* Closed Cover View */
        .card-cover-wrapper {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 3/4;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 5px 10px 25px rgba(0,0,0,0.3);
            border-radius: 8px;
            position: relative;
            background: #7a1c1c;
        }

        .card-cover-wrapper:hover {
            transform: scale(1.02);
        }

        .card-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        /* Open Spread Container */
        .card-spread {
            display: none;
            width: 100%;
            max-width: 850px;
            background: #efe6d5;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            border: 2px solid #cbb89d;
            overflow: hidden;
            position: relative;
            flex-direction: row;
            animation: openCard 0.8s ease-out forwards;
        }

        @keyframes openCard {
            0% { transform: rotateY(-90deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        .page {
            flex: 1;
            padding: 15px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 480px;
        }

        .page-left {
            border-right: 2px dashed #d1c0a5;
            background: rgba(255, 255, 255, 0.3);
        }

        /* Letter & Envelope Interaction */
        .envelope-container {
            width: 100%;
            max-width: 320px;
            position: relative;
            cursor: pointer;
        }

        .envelope-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        /* Pop-out Letter Overlay */
        .letter-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(3px);
        }

        .letter-modal.active {
            display: flex;
        }

        .letter-card {
            max-width: 450px;
            max-height: 85vh;
            width: 90%;
            object-fit: contain;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 6px;
            cursor: pointer;
            animation: pullOut 0.4s ease-out forwards;
        }

        @keyframes pullOut {
            from { transform: translateY(50px) scale(0.8); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Cake & Candle Setup */
        .cake-container {
            width: 100%;
            max-width: 320px;
            position: relative;
        }

        .cake-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Masks over pre-printed flames on original artwork */
        .flame-mask {
            position: absolute;
            background: #e8d9c5; /* Matches background tone behind flames */
            border-radius: 50%;
            filter: blur(2px);
        }

        /* Flame Canvas / Dynamic Flame Elements */
        .flame {
            position: absolute;
            width: 14px;
            height: 22px;
            background: radial-gradient(ellipse at bottom, #ffffff 0%, #ffde59 40%, #ff914d 70%, rgba(255,91,77,0) 100%);
            border-radius: 50% 50% 20% 20%;
            transform-origin: bottom center;
            animation: flicker 0.1s infinite alternate;
            filter: drop-shadow(0 0 6px #ffde59);
            transition: transform 0.1s ease-out, opacity 0.5s ease;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-1deg); }
            100% { transform: scale(1.08) rotate(1deg); }
        }

        .flame.extinguished {
            opacity: 0 !important;
            transform: scale(0) !important;
        }

        /* Controls & Dashboard */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .btn {
            background: #8b2626;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: #a33232;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .mic-bar-container {
            width: 120px;
            height: 8px;
            background: #ccc;
            border-radius: 4px;
            overflow: hidden;
            display: none;
        }

        .mic-bar {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.05s ease;
        }

        .wish-message {
            display: none;
            font-size: 20px;
            font-weight: bold;
            color: #8b2626;
            text-align: center;
            margin-top: 10px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        /* Mobile Layout Adjustments */
        @media (max-width: 700px) {
            .card-spread {
                flex-direction: column;
            }
            .page-left {
                border-right: none;
                border-bottom: 2px dashed #d1c0a5;
            }
            .page {
                min-height: auto;
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="https-note">
        📌 <strong>Note:</strong> Microphone blowing requires a secure context (HTTPS or <code>localhost</code>). If opened as a local <code>file://</code>, please use the <strong>Hold to Blow</strong> fallback button below!
    </div>

    <div class="card-perspective">
        <!-- CLOSED COVER -->
        <div class="card-cover-wrapper" id="cardCover" onclick="openCard()">
            <img class="card-cover-img" src="cover.png" alt="Card Cover">
        </div>

        <!-- OPEN SPREAD -->
        <div class="card-spread" id="cardSpread">
            <!-- LEFT PAGE: LETTER -->
            <div class="page page-left">
                <div class="envelope-container" onclick="openLetter()">
                    <img class="envelope-img" src="letter envelope.png" alt="Envelope with Letter">
                </div>
            </div>

            <!-- RIGHT PAGE: CAKE & CANDLES -->
            <div class="page page-right">
                <div class="cake-container" id="cakeContainer">
                    <img class="cake-img" src="cake.jpg" alt="Birthday Cake">
                    
                    <!-- Cover original flames -->
                    <div class="flame-mask" style="top: 34%; left: 24%; width: 22px; height: 30px;"></div>
                    <div class="flame-mask" style="top: 35%; left: 46%; width: 22px; height: 30px;"></div>
                    <div class="flame-mask" style="top: 35%; left: 69%; width: 22px; height: 30px;"></div>

                    <!-- Overlay Interactive Flames -->
                    <div class="flame" id="flame1" style="top: 34%; left: 26.5%;"></div>
                    <div class="flame" id="flame2" style="top: 35%; left: 48.5%;"></div>
                    <div class="flame" id="flame3" style="top: 35%; left: 71.5%;"></div>
                </div>

                <div class="wish-message" id="wishMessage">Make a wish, Amogh ✨</div>

                <div class="controls">
                    <button class="btn" id="micBtn" onclick="initMic()">🎤 Enable Mic to Blow</button>
                    <div class="mic-bar-container" id="micContainer">
                        <div class="mic-bar" id="micBar"></div>
                    </div>
                    <button class="btn" id="blowBtn" onmousedown="startBlowing()" onmouseup="stopBlowing()" onmouseleave="stopBlowing()" ontouchstart="startBlowing()" ontouchend="stopBlowing()">🌬️ Hold to Blow</button>
                    <button class="btn" id="relightBtn" style="display:none;" onclick="relightCandles()">🔥 Relight Candles</button>
                    <button class="btn" onclick="closeCard()" style="background:#666; margin-top:5px;">👈 Back to Cover</button>
                </div>
            </div>
        </div>
    </div>

    <!-- EXPANDED LETTER POP-UP MODAL -->
    <div class="letter-modal" id="letterModal" onclick="closeLetter()">
        <img class="letter-card" src="letter.jpg" alt="Letter Detail">
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        // --- Card Navigation ---
        function openCard() {
            document.getElementById('cardCover').style.display = 'none';
            document.getElementById('cardSpread').style.display = 'flex';
        }

        function closeCard() {
            document.getElementById('cardSpread').style.display = 'none';
            document.getElementById('cardCover').style.display = 'block';
        }

        function openLetter() {
            document.getElementById('letterModal').classList.add('active');
        }

        function closeLetter() {
            document.getElementById('letterModal').classList.remove('active');
        }

        // --- Blow Detection State ---
        let blowTimer = null;
        let isBlowing = false;
        let candlesBlown = false;

        function startBlowing() {
            if (candlesBlown) return;
            isBlowing = true;
            bendFlames(true);

            if (!blowTimer) {
                blowTimer = setTimeout(() => {
                    extinguishCandles();
                }, 500);
            }
        }

        function stopBlowing() {
            if (candlesBlown) return;
            isBlowing = false;
            bendFlames(false);
            if (blowTimer) {
                clearTimeout(blowTimer);
                blowTimer = null;
            }
        }

        function bendFlames(bend) {
            const flames = document.querySelectorAll('.flame');
            flames.forEach(f => {
                if (!f.classList.contains('extinguished')) {
                    f.style.transform = bend ? 'rotate(25deg) scale(0.9)' : 'none';
                }
            });
        }

        function extinguishCandles() {
            candlesBlown = true;
            bendFlames(false);
            const flames = document.querySelectorAll('.flame');
            flames.forEach(f => f.classList.add('extinguished'));
            
            document.getElementById('wishMessage').style.display = 'block';
            document.getElementById('relightBtn').style.display = 'inline-block';
            document.getElementById('blowBtn').style.display = 'none';
            document.getElementById('micBtn').style.display = 'none';
            document.getElementById('micContainer').style.display = 'none';

            triggerConfetti();
        }

        function relightCandles() {
            candlesBlown = false;
            const flames = document.querySelectorAll('.flame');
            flames.forEach(f => f.classList.remove('extinguished'));
            
            document.getElementById('wishMessage').style.display = 'none';
            document.getElementById('relightBtn').style.display = 'none';
            document.getElementById('blowBtn').style.display = 'inline-block';
            document.getElementById('micBtn').style.display = 'inline-block';
        }

        // --- Keyboard Fallback (Spacebar) ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) startBlowing();
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') stopBlowing();
        });

        // --- Web Audio API Microphone Detection ---
        async function initMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(stream);
                
                analyser.fftSize = 256;
                microphone.connect(analyser);

                document.getElementById('micBtn').style.display = 'none';
                document.getElementById('micContainer').style.display = 'block';

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                const micBar = document.getElementById('micBar');

                function checkAudio() {
                    analyser.getByteFrequencyData(dataArray);
                    
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i];
                    }
                    let average = sum / bufferLength;
                    
                    // Display audio level
                    micBar.style.width = Math.min(100, (average / 70) * 100) + '%';

                    // Threshold for detecting airflow noise (blowing)
                    if (average > 50) {
                        startBlowing();
                    } else {
                        stopBlowing();
                    }

                    if (!candlesBlown) {
                        requestAnimationFrame(checkAudio);
                    }
                }
                checkAudio();
            } catch (err) {
                alert('Microphone access blocked or unavailable. Please use the hold-to-blow button!');
            }
        }

        // --- Simple Confetti Animation ---
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#ff4081', '#ffeb3b', '#00e676', '#00b0ff', '#d500f9'];

            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.8) * 12,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 10
                });
            }

            let animationFrame;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.25; // gravity
                    p.rotation += p.rSpeed;

                    if (p.y < canvas.height) alive = true;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (alive) {
                    animationFrame = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrame);
                }
            }
            render();
        }
    </script>
</body>
</html>
